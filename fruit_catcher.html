<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Catcher</title>
<style>
    body { margin: 0; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { background: #fff; border: 1px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const cup = { x: canvas.width / 2 - 40, y: canvas.height - 60, width: 80, height: 50, speed: 7 };
let fruits = [];
let score = 0;
let lastSpawn = 0;

function spawnFruit() {
    const radius = 15 + Math.random() * 10;
    const x = Math.random() * (canvas.width - 2 * radius) + radius;
    const speed = 2 + Math.random() * 3;
    const colors = ['#ff0000', '#ffa500', '#ffff00', '#00ff00', '#800080'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    fruits.push({ x, y: -radius, radius, speed, color });
}

function drawCup() {
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(cup.x, cup.y, cup.width, cup.height);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('Booster', cup.x + 10, cup.y + 20);
    ctx.fillText('Juice', cup.x + 20, cup.y + 40);
}

function drawFruit(fruit) {
    ctx.beginPath();
    ctx.arc(fruit.x, fruit.y, fruit.radius, 0, Math.PI * 2);
    ctx.fillStyle = fruit.color;
    ctx.fill();
    ctx.closePath();
}

function drawScore() {
    ctx.fillStyle = '#000';
    ctx.font = '16px Arial';
    ctx.fillText('Score: ' + score, 10, 20);
}

function update(timestamp) {
    if (timestamp - lastSpawn > 1000) {
        spawnFruit();
        lastSpawn = timestamp;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    fruits.forEach((fruit, index) => {
        fruit.y += fruit.speed;
        if (fruit.y - fruit.radius > canvas.height) {
            fruits.splice(index, 1);
        } else if (
            fruit.x > cup.x &&
            fruit.x < cup.x + cup.width &&
            fruit.y + fruit.radius > cup.y &&
            fruit.y - fruit.radius < cup.y + cup.height
        ) {
            fruits.splice(index, 1);
            score += 1;
        } else {
            drawFruit(fruit);
        }
    });

    drawCup();
    drawScore();
    requestAnimationFrame(update);
}

let keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function moveCup() {
    if (keys['ArrowLeft']) cup.x -= cup.speed;
    if (keys['ArrowRight']) cup.x += cup.speed;
    cup.x = Math.max(0, Math.min(canvas.width - cup.width, cup.x));
    requestAnimationFrame(moveCup);
}

requestAnimationFrame(update);
requestAnimationFrame(moveCup);
</script>
</body>
</html>
